name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Python format lint
        run: python3 tools/check_format.py

      - name: Playwright lint project
        run: npx playwright test --config=config/playwright.config.js --project=lint

  chromium:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: chromium (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run chromium tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --config=config/playwright.config.js --project=chromium --shard=${{ matrix.shard }}/4 --no-deps

  release:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run release tests
        run: npx playwright test --config=config/playwright.config.js --project=release --no-deps
